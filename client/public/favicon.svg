<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151e" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Left Wing Gradient: Electric Violet to Indigo -->
    <linearGradient id="fav-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Wing Gradient: Indigo to Vibrant Purple -->
    <linearGradient id="fav-grad-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="55%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Central Fracture Pulse: Electric Cyan & Bright Spark -->
    <linearGradient id="fav-grad-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle for crisp tab visibility -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#fav-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Left Wing of W -->
  <path
    d="M8.5 13C8.5 11.9 9.4 11 10.5 11H14.2C15.2 11 16.1 11.6 16.5 12.5L20.8 24.5L17.2 35.5C16.8 36.5 15.6 37.1 14.5 36.6L10.5 34.8C9.4 34.3 8.7 33.2 8.7 32L8.5 13Z"
    fill="url(#fav-grad-left)"
  />

  <!-- Right Wing of W -->
  <path
    d="M39.5 13C39.5 11.9 38.6 11 37.5 11H33.8C32.8 11 31.9 11.6 31.5 12.5L27.2 24.5L30.8 35.5C31.2 36.5 32.4 37.1 33.5 36.6L37.5 34.8C38.6 34.3 39.3 33.2 39.3 32L39.5 13Z"
    fill="url(#fav-grad-right)"
  />

  <!-- Central Diagnostic Lightning Break -->
  <path
    d="M25.5 14L20.5 24H24.8L22 35L29 22.5H24.2L27 14H25.5Z"
    fill="url(#fav-grad-pulse)"
    filter="url(#fav-glow)"
  />

  <!-- Radiant AI Diagnostic Star -->
  <path
    d="M24 7L25 10.5L28.5 11.5L25 12.5L24 16L23 12.5L19.5 11.5L23 10.5L24 7Z"
    fill="#ffffff"
    filter="url(#fav-glow)"
  />
  <circle cx="24" cy="11.5" r="1.2" fill="#38bdf8" />
</svg>
